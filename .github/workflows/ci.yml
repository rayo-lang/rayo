name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      LLVM_MAJOR_VERSION: 23
      # The fingerprint apt.llvm.org publishes for the key that signs its packages.
      LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          fingerprint=$(gpg --show-keys --with-colons /usr/share/keyrings/llvm.gpg | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fingerprint" != "$LLVM_KEY_FINGERPRINT" ]; then
            echo "::error::apt.llvm.org's key has fingerprint '$fingerprint', not $LLVM_KEY_FINGERPRINT"
            exit 1
          fi
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR_VERSION main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends "llvm-$LLVM_MAJOR_VERSION-dev=1:$LLVM_MAJOR_VERSION.1.*"
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the checker
        run: python3 -m unittest discover -s scripts
      - name: Check links, layout and readability
        run: python3 scripts/check_docs.py
