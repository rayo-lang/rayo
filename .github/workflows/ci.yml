name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
