name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      LLVM_MAJOR_VERSION: 23
      # The fingerprint apt.llvm.org publishes for the key that signs its packages.
      LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          # apt trusts every key in the keyring, so it gets the one key with the published fingerprint and no other
          # key the download might hold.
          keys=$(mktemp -d)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$keys/llvm.asc"
          gpg --homedir "$keys" --batch --import "$keys/llvm.asc"
          gpg --homedir "$keys" --batch --export "$LLVM_KEY_FINGERPRINT" > /usr/share/keyrings/llvm.gpg
          if [ ! -s /usr/share/keyrings/llvm.gpg ]; then
            echo "::error::apt.llvm.org's key file holds no key with fingerprint $LLVM_KEY_FINGERPRINT"
            exit 1
          fi
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR_VERSION main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          # The pin keeps the major release: apt.llvm.org serves only the newest build of it, so no exact build
          # can be named.
          apt-get install -y --no-install-recommends "llvm-$LLVM_MAJOR_VERSION-dev=1:$LLVM_MAJOR_VERSION.1.*"
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the checker
        run: python3 -m unittest discover -s scripts
      - name: Check links, layout and readability
        run: python3 scripts/check_docs.py
