name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run on its last push moot. A push to main runs to the end, since its run
# saves the caches that pull requests start from.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # The Swift release every platform tests with. The Linux job's container is named from it, and each test job
  # checks that its Swift is this release.
  SWIFT_RELEASE: "6.4"
  LLVM_MAJOR_VERSION: 23

jobs:
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      test-paths: ${{ steps.paths.outputs.test-paths }}
      docs: ${{ steps.paths.outputs.docs }}
      benchmarks: ${{ steps.paths.outputs.benchmarks }}
      swift-release: ${{ env.SWIFT_RELEASE }}
    steps:
      # A pull request needs only its merge commit and the merge's parents; a push to main needs the commit main
      # was at, however far back.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Sort the changed paths into code and docs
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's run checks out the merge of its head into its base, so the merge's first parent is
          # the base. A push to main compares with the commit main was at. Where there is nothing sure to compare
          # with, such as a merge with one parent or a push whose old commit is gone, everything runs.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git rev-parse -q --verify HEAD^2 > /dev/null; then
            base=HEAD^1
          elif [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "benchmarks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A rename counts as its old path and its new one, so a file moved out of the sources still runs the
          # tests.
          changed=$(git diff --name-only --no-renames "$base" HEAD)
          deleted=$(git diff --name-only --no-renames --diff-filter=D "$base" HEAD)

          # The test paths are the changed paths that can change what a test does, which `select_tests.py` names,
          # so CI and a local run of the tests agree on them. The code jobs also run the scripts that pick the tests
          # and check the imports, which no test reads. The docs check reads every Markdown file, its own scripts
          # and every file a link names, so a deleted file of any kind can break a link. The docs job also tests the
          # benchmark script, since the benchmark job doesn't block a merge.
          test_paths=$(python3 scripts/select_tests.py <<< "$changed")
          script_paths='^scripts/(select_tests|run_affected_tests|check_imports)\.py$'
          docs_paths='\.md$|^scripts/|^Benchmarks/|^\.github/workflows/ci\.yml$'
          if [ "$test_paths" != '[]' ] || grep -q -E "$script_paths" <<< "$changed"; then
            code=true
          else
            code=false
          fi
          if grep -q -E "$docs_paths" <<< "$changed" || [ -n "$deleted" ]; then docs=true; else docs=false; fi
          # The benchmarks measure the rayoc that the compiler's sources and manifest build, with a script of their
          # own, in a job that the workflow and the Linux toolchain's action set up.
          benchmark_paths='^(Sources|Benchmarks)/|^Package\.swift$|^\.github/'
          benchmark_paths+='(workflows/ci\.yml$|actions/linux-toolchain/)'
          if grep -q -E "$benchmark_paths" <<< "$changed"; then benchmarks=true; else benchmarks=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "benchmarks=$benchmarks" >> "$GITHUB_OUTPUT"

          # A pull request runs only the tests that its test paths reach, which each test job finds from them, and
          # without any, as when it changes only the code jobs' scripts, the jobs only build. A push to main runs
          # every test, since its build is the one pull requests start from.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$code" = true ]; then
            echo "test-paths=$test_paths" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Test on Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:${{ needs.changes.outputs.swift-release }}-noble
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-toolchain
        id: toolchain

      - uses: ./.github/actions/swift-test
        id: test
        with:
          platform: linux
          llvm-version: ${{ steps.toolchain.outputs.llvm-version }}
          changed-paths: ${{ needs.changes.outputs.test-paths }}
          # One platform builds the release toolchain users run, and runs the proof programs with it; what differs
          # between platforms the debug tests cover on each.
          release-proof-programs: "true"
      # A toolchain's folder holds rayoc in its bin and LLVM's library in the lib beside it, and runs on a machine
      # whose loader finds no other LLVM. So the step lays out such a folder from the release build, hides apt's
      # LLVM from the loader, and has the folder's rayoc compile a proof program.
      - name: Run rayoc from a toolchain folder of its own
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        # A container's steps run in sh unless they name another shell.
        shell: bash
        env:
          BIN: ${{ steps.test.outputs.release-bin-path }}
          PROGRAM: examples/v0.1/combat.rayo
        run: |
          # Each check prints the lines it reads, and fails the step with its message where none of them matches
          # what grep's remaining arguments ask for.
          expect() {
            local lines=$1 message=$2
            shift 2
            printf '%s\n' "$lines"
            grep -q "$@" <<< "$lines" || { echo "::error::$message"; exit 1; }
          }

          # rayoc looks for LLVM's library in the lib beside its bin. readelf prints the search path in brackets,
          # its entries separated by colons.
          rayoc="$BIN/rayoc"
          entries=$(readelf -d "$rayoc" | sed -n -E 's/.*\((RUNPATH|RPATH)\).*\[(.*)\]/\2/p' | tr ':' '\n')
          expect "$entries" "release rayoc doesn't look for LLVM's library in \$ORIGIN/../lib" -x -F '$ORIGIN/../lib'

          # The folder holds rayoc, and a copy of the LLVM library it names, from where the loader finds it now.
          library=$(readelf -d "$rayoc" | sed -n -E 's/.*\(NEEDED\).*\[(libLLVM[^]]*)\]/\1/p')
          if [ -z "$library" ]; then
            echo "::error::release rayoc names no LLVM library that it needs"
            exit 1
          fi
          loaded=$(ldd "$rayoc" | awk -v library="$library" '$1 == library { print $3 }')
          toolchain="$RUNNER_TEMP/toolchain"
          mkdir -p "$toolchain/bin" "$toolchain/lib"
          cp "$rayoc" "$toolchain/bin/rayoc"
          cp -L "$loaded" "$toolchain/lib/$library"

          # Every other file of that name is moved aside, and the loader's cache rebuilt without it. They are put
          # back however the step ends.
          hidden="$RUNNER_TEMP/hidden-llvm"
          mkdir -p "$hidden"
          mapfile -t copies < <(find /usr -name "$library")
          restore() {
            for index in "${!copies[@]}"; do mv "$hidden/$index" "${copies[$index]}"; done
            ldconfig
          }
          trap restore EXIT
          for index in "${!copies[@]}"; do mv "${copies[$index]}" "$hidden/$index"; done
          ldconfig

          # The rayoc the folder copied has no lib beside its bin, so it finds no LLVM now: the install is hidden.
          expect "$(ldd "$rayoc")" "the loader still finds $library outside the toolchain's folder" \
            -F "$library => not found"

          # The folder's rayoc loads the folder's library, and compiles a program to object code with it.
          expect "$(ldd "$toolchain/bin/rayoc")" "the toolchain folder's rayoc doesn't load $library from its lib" \
            -F "$library => $toolchain/lib/$library"
          "$toolchain/bin/rayoc" -o "$RUNNER_TEMP/program.o" -- "$PROGRAM"
          if [ ! -s "$RUNNER_TEMP/program.o" ]; then
            echo "::error::the toolchain folder's rayoc wrote no object code for $PROGRAM"
            exit 1
          fi
      # A target can import a module through a dependency it doesn't name, so the check reads the imports
      # themselves: of LLVM's C module, and of syntax after semantic checking. They are the same on every platform,
      # so it runs here alone, whether or not the tests passed. It runs once LLVM is installed, since LLVM's
      # packages bring the `python3` it runs with.
      - name: Check the imports that the manifest can't limit
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 scripts/check_imports.py

  macos:
    name: Test on macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Swift 6.4 comes with Xcode 27, which GitHub installs only on its image of that name. A new Swift release
    # changes this label with it, and the step that selects Xcode fails until it does.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Install the formulae the runner's Homebrew already knows, without the update it would run first.
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Keep the bottles Homebrew downloads after it installs them, so the cache can hold them.
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/macos-toolchain
        id: toolchain

      - uses: ./.github/actions/swift-test
        with:
          platform: macos
          llvm-version: ${{ steps.toolchain.outputs.llvm-version }}
          changed-paths: ${{ needs.changes.outputs.test-paths }}

  windows:
    name: Test on Windows ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Each architecture builds and tests on a runner of its own, natively, from the one list of steps, so the Swift
    # and LLVM builds it pins below are the same for both. A failure on one doesn't cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio 2022 is the release Swift's Windows install names, with its C runtime and Windows SDK;
          # GitHub's arm64 image holds it too, with its ARM64 build tools.
          - name: x64
            runner: windows-2022
            swift-arch: amd64
            triple: x86_64-pc-windows-msvc
          - name: arm64
            runner: windows-11-arm
            swift-arch: arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # The exact Swift build to install, of SWIFT_RELEASE; Swift's Windows installer names one.
      SWIFT_BUILD: 6.4.2
      # The exact LLVM build to install, of LLVM_MAJOR_VERSION. Only the archive LLVM publishes for Windows holds
      # the headers rayoc builds against: its installer and the package managers that use it hold none.
      LLVM_BUILD: 23.1.5
      # The target LLVM's Windows archive is built for, which its name ends in.
      LLVM_TRIPLE: ${{ matrix.triple }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_BUILD }}-release
          swift-build: ${{ env.SWIFT_BUILD }}-RELEASE
          build_arch: ${{ matrix.swift-arch }}

      - name: Restore LLVM
        id: llvm-archive
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ env.LLVM_BUILD }}-windows-${{ runner.arch }}
      - name: Download LLVM
        if: steps.llvm-archive.outputs.cache-hit != 'true'
        run: |
          release="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_BUILD"
          curl -fsSL --retry 3 -w 'Downloaded %{size_download} bytes in %{time_total}s\n' \
            -o "$RUNNER_TEMP/llvm.tar.xz" "$release/clang+llvm-$LLVM_BUILD-$LLVM_TRIPLE.tar.xz"
      # The archive holds a whole install, thousands of files of it libraries rayoc doesn't link, so only what rayoc
      # builds against and its tests run is unpacked: LLVM's C API headers and library, the release's version files,
      # and the tools. Windows' own tar takes many minutes to decompress the archive, so the 7-Zip the runner's
      # image installs decompresses it, and a second 7-Zip unpacks those files from the stream, listing each.
      - name: Unpack LLVM
        if: steps.llvm-archive.outputs.cache-hit != 'true'
        run: |
          name="clang+llvm-$LLVM_BUILD-$LLVM_TRIPLE"
          members=(
            include/llvm-c include/llvm/Config lib/LLVM-C.lib bin/LLVM-C.dll lib/cmake/lld
            bin/clang.exe bin/lld.exe bin/lld-link.exe bin/llvm-config.exe bin/llvm-nm.exe bin/llvm-readobj.exe
          )
          7z x -so "$(cygpath -w "$RUNNER_TEMP/llvm.tar.xz")" \
            | 7z x -si -ttar -bb1 -o"$(cygpath -w "$RUNNER_TEMP")" "${members[@]/#/$name/}"
          mv "$RUNNER_TEMP/$name" "$RUNNER_TEMP/llvm"

          # 7-Zip unpacks nothing for a file the archive lacks, and doesn't fail.
          for member in "${members[@]}"; do
            [ -e "$RUNNER_TEMP/llvm/$member" ] || { echo "::error::the LLVM archive holds no $member"; exit 1; }
          done
      # Only a push to main saves LLVM, as it does the build, so pull requests share main's one copy.
      - name: Save LLVM
        if: github.event_name == 'push' && steps.llvm-archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm-archive.outputs.cache-primary-key }}
      # rayoc builds against the archive, and loads its LLVM-C.dll from the search path, ahead of the LLVM the
      # runner's image installs.
      - name: Use LLVM
        run: |
          llvm=$(cygpath -m "$RUNNER_TEMP/llvm")
          echo "LLVM_PREFIX=$llvm" >> "$GITHUB_ENV"
          cygpath -w "$llvm/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/swift-test
        with:
          platform: windows
          llvm-version: ${{ env.LLVM_BUILD }}
          changed-paths: ${{ needs.changes.outputs.test-paths }}

  # Counts both sides' instructions under Valgrind, since GitHub's runners count none, and fails past the threshold.
  # The CI check leaves it out, since a change may cost more on purpose.
  benchmarks:
    name: Benchmark on Linux
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: swift:${{ needs.changes.outputs.swift-release }}-noble
    env:
      # Valgrind runs rayoc about 40 times slower, so these take about two minutes a side.
      # Printing costs little past checking, and a release compile's cost is mostly LLVM's.
      SIZES: 50,100,200
      STOPS: check,compile-debug
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-toolchain
        id: toolchain
        with:
          packages: valgrind time
      # The container runs as root, and git refuses a checkout another user owns, which the runner's user does.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # A build is reused only by the same Swift compiler and LLVM, as the test jobs' are. Only a push to main saves
      # one, under its commit, so a pull request whose base is that commit starts from its build, and any other
      # starts from the latest build main saved.
      - name: Name the build's cache
        id: name
        env:
          LLVM_VERSION: ${{ steps.toolchain.outputs.llvm-version }}
          COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          toolchain=$( (swift --version 2>&1; echo "$LLVM_VERSION") | git hash-object --stdin | cut -c 1-16)
          prefix="benchmark-build-linux-$RUNNER_ARCH-$toolchain-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Restore the build
        id: build
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ steps.name.outputs.key }}
          restore-keys: ${{ steps.name.outputs.prefix }}
      - name: Build release rayoc
        if: github.event_name == 'push'
        run: swift build -c release --product rayoc
      - name: Save the build
        if: github.event_name == 'push' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.name.outputs.key }}

      # The pull request's script measures both sides, so a base older than the script is measured too. It runs
      # from a copy, since the checkout moves to the base and back.
      - name: Copy the benchmark script
        if: github.event_name == 'pull_request'
        run: cp -R Benchmarks "$RUNNER_TEMP/benchmarks"

      # Only the base is fetched. The pull request is then built in the same place, so its build compiles only what
      # it changed. A base that can't be fetched or built leaves the pull request measured alone.
      - name: Measure the base
        if: github.event_name == 'pull_request'
        id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if ! git fetch --depth=1 origin "$BASE"; then
            echo "::notice::The base '$BASE' couldn't be fetched, so the pull request is measured alone."
            exit 0
          fi
          git checkout --detach FETCH_HEAD
          if ! python3 "$RUNNER_TEMP/benchmarks/benchmark.py" --package . --counter valgrind --sizes "$SIZES" \
            --stops "$STOPS" --save --code 'the base'
          then
            echo "::notice::The base '$BASE' couldn't be built or measured, so the pull request is measured alone."
            exit 0
          fi
          echo "commit=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Measure the pull request and compare it with the base
        if: github.event_name == 'pull_request'
        env:
          HEAD_COMMIT: ${{ steps.base.outputs.head }}
          BASE_COMMIT: ${{ steps.base.outputs.commit }}
        run: |
          git checkout --detach "$HEAD_COMMIT"
          python3 "$RUNNER_TEMP/benchmarks/benchmark.py" --package . --counter valgrind --sizes "$SIZES" \
            --stops "$STOPS" --code 'the pull request' --summary "$GITHUB_STEP_SUMMARY" \
            ${BASE_COMMIT:+--compare "$BASE_COMMIT"}

  docs:
    name: Check docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test the checker
        run: python3 -m unittest discover -s scripts
      - name: Test the benchmark script
        run: python3 -m unittest discover -s Benchmarks
      - name: Check links, layout and readability
        run: python3 scripts/check_docs.py

  # The one check main's ruleset requires. A job that a change doesn't touch is skipped, and a skipped job passes
  # here, so a change runs only the jobs it needs and still reports one result. It runs even when a job it needs
  # was cancelled, and fails then, since a skipped required check would pass.
  ci:
    name: CI
    needs: [changes, linux, macos, windows, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job CI needs ended in '$result'"; exit 1 ;;
            esac
          done
