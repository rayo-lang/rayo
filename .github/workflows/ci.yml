name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      LLVM_MAJOR_VERSION: 23
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR_VERSION main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            llvm-$LLVM_MAJOR_VERSION-dev clang-$LLVM_MAJOR_VERSION lld-$LLVM_MAJOR_VERSION
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the checker
        run: python3 -m unittest discover -s scripts
      - name: Check links, layout and readability
        run: python3 scripts/check_docs.py
