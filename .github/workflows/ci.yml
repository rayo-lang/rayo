name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes the run on its last push moot. A push to main runs to the end, since its run
# saves the caches that pull requests start from.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.4"
  LLVM_MAJOR_VERSION: 23

jobs:
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sort the changed paths into code and docs
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's run checks out the merge of its head into its base, so the merge's first parent is
          # the base. A push to main compares with the commit main was at, and runs everything when that commit
          # is gone, as after a force push.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=HEAD^1
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)

          # The compiler's build reads only its sources, its tests and the package manifest; the docs check reads
          # every Markdown file and its own scripts. Both read this workflow.
          code='^(Sources|Tests)/|^Package\.(swift|resolved)$|^\.github/workflows/ci\.yml$'
          docs='\.md$|^scripts/|^\.github/workflows/ci\.yml$'
          echo "code=$(grep -q -E "$code" <<< "$changed" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docs=$(grep -q -E "$docs" <<< "$changed" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    name: Test on ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            container: swift:6.4-noble
          - name: macOS
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # The fingerprint apt.llvm.org publishes for the key that signs its packages.
      LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
      # Where the LLVM packages for Linux are kept between runs. Raising the revision fetches apt.llvm.org's newest
      # build of the release, since the cache otherwise keeps the build it first fetched.
      LLVM_PACKAGES: /var/cache/rayo-llvm
      LLVM_PACKAGES_REVISION: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v7

      - name: Restore the LLVM packages
        if: runner.os == 'Linux'
        id: llvm-packages
        uses: actions/cache@v6
        with:
          path: ${{ env.LLVM_PACKAGES }}
          key: llvm-${{ env.LLVM_MAJOR_VERSION }}-noble-r${{ env.LLVM_PACKAGES_REVISION }}
      - name: Fetch the LLVM packages
        if: runner.os == 'Linux' && steps.llvm-packages.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg

          # apt trusts every key in the keyring, so it gets the one key with the published fingerprint and no other
          # key the download might hold.
          keys=$(mktemp -d)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$keys/llvm.asc"
          gpg --homedir "$keys" --batch --import "$keys/llvm.asc"
          gpg --homedir "$keys" --batch --export "$LLVM_KEY_FINGERPRINT" > /usr/share/keyrings/llvm.gpg
          if [ ! -s /usr/share/keyrings/llvm.gpg ]; then
            echo "::error::apt.llvm.org's key file holds no key with fingerprint $LLVM_KEY_FINGERPRINT"
            exit 1
          fi

          # Fetch LLVM, clang and LLD with each dependency the container lacks, into the directory the cache keeps.
          # The pin keeps the major release: apt.llvm.org serves only the newest build of it, so no exact build
          # can be named.
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_MAJOR_VERSION main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          mkdir -p "$LLVM_PACKAGES/partial"
          version="1:$LLVM_MAJOR_VERSION.1.*"
          apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$LLVM_PACKAGES" \
            "llvm-$LLVM_MAJOR_VERSION-dev=$version" "clang-$LLVM_MAJOR_VERSION=$version" \
            "lld-$LLVM_MAJOR_VERSION=$version"
          rm -rf "$LLVM_PACKAGES/partial" "$LLVM_PACKAGES/lock"
      - name: Install LLVM
        if: runner.os == 'Linux'
        # The packages and their dependencies install together, so dpkg needs no package index and no network.
        run: dpkg -i "$LLVM_PACKAGES"/*.deb

      - name: Select the Xcode that holds Swift ${{ env.SWIFT_VERSION }}
        if: runner.os == 'macOS'
        run: |
          for xcode in /Applications/Xcode*.app; do
            developer="$xcode/Contents/Developer"
            if DEVELOPER_DIR="$developer" xcrun swift --version 2>/dev/null | grep -q "Swift version $SWIFT_VERSION"; then
              echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no Xcode on this runner holds Swift $SWIFT_VERSION"
          exit 1
      # Homebrew keeps each bottle it downloads, so a cache keyed on the versions it would install holds those
      # bottles, and a new version gets a cache of its own.
      - name: Find the LLVM and LLD versions Homebrew installs
        if: runner.os == 'macOS'
        id: brew
        run: |
          versions=$(brew info --json=v2 "llvm@$LLVM_MAJOR_VERSION" "lld@$LLVM_MAJOR_VERSION" \
            | jq -r '[.formulae[] | .name + "-" + .versions.stable] | join("-")')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - name: Restore Homebrew's downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ steps.brew.outputs.versions }}-${{ runner.arch }}
      - name: Install LLVM
        if: runner.os == 'macOS'
        run: brew install "llvm@$LLVM_MAJOR_VERSION" "lld@$LLVM_MAJOR_VERSION"

      # A pull request starts from the build main last saved, so it compiles only what it changed. Only a push to
      # main saves a build, which keeps the cache to one build per platform.
      - name: Restore the build
        id: build
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: build-${{ matrix.name }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: build-${{ matrix.name }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-
      - name: Test
        run: swift test
      - name: Save the build
        if: github.event_name == 'push' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.build.outputs.cache-primary-key }}

  docs:
    name: Check docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the checker
        run: python3 -m unittest discover -s scripts
      - name: Check links, layout and readability
        run: python3 scripts/check_docs.py

  # The one check main's ruleset requires. A job that a change doesn't touch is skipped, and a skipped job passes
  # here, so a change runs only the jobs it needs and still reports one result.
  ci:
    name: CI
    needs: [changes, test, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job CI needs ended in '$result'"; exit 1 ;;
            esac
          done
