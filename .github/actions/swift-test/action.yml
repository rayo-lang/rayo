name: Test with SwiftPM
description: Runs swift test from the build main last saved, and saves the build on a push to main.

inputs:
  platform:
    description: The platform the build is for, which names its cache.
    required: true
  llvm-version:
    description: The exact build of LLVM the compiler links, which a cached build depends on.
    required: true
  arguments:
    description: What swift test takes besides, such as the tests a platform can't run.
    required: false
    default: ""
  changed-paths:
    description: >-
      The paths a pull request changes that can change what a test does, as a JSON array; without them, every test
      runs.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the Swift release
      shell: bash
      run: |
        release=$(swift --version 2>&1 | grep -o -E 'Swift version [0-9]+\.[0-9]+' | head -n 1)
        if [ "$release" != "Swift version $SWIFT_RELEASE" ]; then
          echo "::error::this job runs '${release:-no Swift}', and CI tests with Swift $SWIFT_RELEASE"
          exit 1
        fi

    # A build is reused only by the same Swift compiler and the same LLVM, down to the patch and the package
    # build, since either one changing can leave modules or links the next build can't use.
    - name: Name the build's cache
      id: name
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
        SOURCES: ${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
      run: |
        toolchain=$( (swift --version 2>&1; echo "$LLVM_VERSION") | git hash-object --stdin | cut -c 1-16)
        prefix="build-$PLATFORM-$RUNNER_ARCH-$toolchain-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$SOURCES" >> "$GITHUB_OUTPUT"

    # A pull request starts from the build main last saved, so it compiles only what it changed. Only a push to
    # main saves a build, which keeps the cache to one build per platform and architecture.
    - name: Restore the build
      id: build
      uses: actions/cache/restore@v6
      with:
        path: .build
        key: ${{ steps.name.outputs.key }}
        restore-keys: ${{ steps.name.outputs.prefix }}
    # A runner's network can stall partway through a fetch, so a fetch that fails is tried again, a few times with a
    # pause between tries. A failed fetch can leave the build or SwiftPM's shared cache naming a clone or a download
    # that was never made, so before the next try both lose the dependencies the failed one fetched. Each try clones
    # into the build alone, skipping the shared cache, since a runner starts with that cache empty and keeps nothing
    # in it. A restored build that already holds the versions Package.resolved pins fetches nothing.
    - name: Resolve the dependencies
      shell: bash
      run: |
        tries=4
        for try in $(seq "$tries"); do
          if swift package --disable-dependency-cache --force-resolved-versions resolve; then
            exit 0
          fi
          if [ "$try" -lt "$tries" ]; then
            echo "::warning::fetching the dependencies failed on try $try of $tries; trying again"
            rm -rf .build/repositories .build/checkouts .build/prebuilts .build/workspace-state.json
            swift package purge-cache
            sleep $((try * 15))
          fi
        done
        exit 1
    # The test targets the changed paths reach, by the manifest's dependencies, are the ones a run needs.
    - name: Select the tests
      id: tests
      shell: bash
      env:
        CHANGED_PATHS: ${{ inputs.changed-paths }}
      run: |
        # Without changed paths, as on a push to main, every test runs.
        if [ -z "$CHANGED_PATHS" ]; then
          selection=all
        else
          swift package dump-package > "$RUNNER_TEMP/package.json"
          printf '%s' "$CHANGED_PATHS" > "$RUNNER_TEMP/changed-paths.json"
          # Windows names its Python `python`. Linux's container has the `python3` that LLVM's packages install.
          if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
          selection=$("$python" scripts/select_tests.py "$RUNNER_TEMP/package.json" "$RUNNER_TEMP/changed-paths.json")
        fi
        echo "Selected tests: $selection"
        echo "selection=$selection" >> "$GITHUB_OUTPUT"
    - name: Test
      shell: bash
      env:
        ARGUMENTS: ${{ inputs.arguments }}
        SELECTION: ${{ steps.tests.outputs.selection }}
      # The arguments are words, split where they have spaces.
      run: |
        case "$SELECTION" in
          all) swift test $ARGUMENTS ;;
          # A change no test target reaches still has to build.
          none) swift build --build-tests ;;
          *) swift test $ARGUMENTS --filter "$SELECTION" ;;
        esac
    - name: Save the build
      if: github.event_name == 'push' && steps.build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .build
        key: ${{ steps.build.outputs.cache-primary-key }}
