name: Test with SwiftPM
description: Runs swift test from the build main last saved, and saves the build on a push to main.

inputs:
  platform:
    description: The platform the build is for, which names its cache.
    required: true
  llvm-version:
    description: The exact build of LLVM the compiler links, which a cached build depends on.
    required: true
  arguments:
    description: What swift test takes besides, such as the tests a platform can't run.
    required: false
    default: ""
  changed-paths:
    description: >-
      The paths a pull request changes that can change what a test does, as a JSON array; without them, every test
      runs.
    required: false
    default: ""
  release-proof-programs:
    description: >-
      Whether to build rayo and rayoc in release, as users build them, and run every version's proof program with
      them, in debug and in release builds.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check the Swift release
      shell: bash
      run: |
        release=$(swift --version 2>&1 | grep -o -E 'Swift version [0-9]+\.[0-9]+' | head -n 1)
        if [ "$release" != "Swift version $SWIFT_RELEASE" ]; then
          echo "::error::this job runs '${release:-no Swift}', and CI tests with Swift $SWIFT_RELEASE"
          exit 1
        fi

    # A build is reused only by the same Swift compiler and the same LLVM, down to the patch and the package
    # build, since either one changing can leave modules or links the next build can't use.
    - name: Name the build's cache
      id: name
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        LLVM_VERSION: ${{ inputs.llvm-version }}
        SOURCES: ${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
      run: |
        toolchain=$( (swift --version 2>&1; echo "$LLVM_VERSION") | git hash-object --stdin | cut -c 1-16)
        prefix="build-$PLATFORM-$RUNNER_ARCH-$toolchain-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$SOURCES" >> "$GITHUB_OUTPUT"

    # A pull request starts from the build main last saved, so it compiles only what it changed. Only a push to
    # main saves a build, which keeps the cache to one build per platform and architecture.
    - name: Restore the build
      id: build
      uses: actions/cache/restore@v6
      with:
        path: .build
        key: ${{ steps.name.outputs.key }}
        restore-keys: ${{ steps.name.outputs.prefix }}
    - name: Diagnose the restored build
      shell: bash
      run: |
        nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || true
        ls -la .build .build/prebuilts .build/prebuilts/* 2>&1 | head -40
        mkdir -p "$RUNNER_TEMP/restored"
        cp .build/*.yaml "$RUNNER_TEMP/restored/" 2>/dev/null || true
        ls -la "$RUNNER_TEMP/restored"
        stat .build/checkouts/swift-syntax/Sources/SwiftSyntax/SyntaxProtocol.swift 2>&1 || true
    # A runner's network can stall partway through a fetch, so a fetch that fails is tried again, a few times with a
    # longer pause before each new try. Git gives up on a transfer that stays below 1 KB a second for a minute, so
    # a stall fails its try rather than hanging until the job times out.
    #
    # A fetch that fails partway can leave the build naming a clone that was never made. So before the next try,
    # the step deletes the clones, checkouts and downloads in .build, and the record of them, and keeps the rest of
    # the restored build, which `swift package reset` would delete too. Each try clones into .build alone, skipping
    # SwiftPM's shared cache, since a runner starts with that cache empty and keeps nothing in it.
    #
    # A restored build that already holds the versions Package.resolved pins fetches nothing.
    - name: Resolve the dependencies
      shell: bash
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "60"
      run: |
        tries=4
        pause_seconds=15
        for try in $(seq "$tries"); do
          if swift package --disable-dependency-cache --force-resolved-versions resolve; then
            exit 0
          fi
          if [ "$try" -lt "$tries" ]; then
            echo "::warning::fetching the dependencies failed on try $try of $tries; trying again"
            # A file that can't be deleted, such as one Windows holds open, mustn't end the tries early.
            rm -rf .build/repositories .build/checkouts .build/prebuilts .build/artifacts \
              .build/workspace-state.json || true
            sleep $((try * pause_seconds))
          fi
        done
        echo "::error::fetching the dependencies failed $tries times"
        exit 1
    # A pull request runs the tests of the test targets its changed paths reach by the manifest's dependencies, as
    # an agent runs them before it opens one, and builds the tests where it reaches none.
    - name: Test
      shell: bash
      env:
        ARGUMENTS: ${{ inputs.arguments }}
        CHANGED_PATHS: ${{ inputs.changed-paths }}
      # The arguments are words, split where they have spaces.
      run: |
        # Without changed paths, as on a push to main, every test runs.
        if [ -z "$CHANGED_PATHS" ]; then
          swift test $ARGUMENTS
        else
          printf '%s' "$CHANGED_PATHS" > "$RUNNER_TEMP/changed-paths.json"
          # Windows names its Python `python`. Linux's container has the `python3` that LLVM's packages install.
          if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
          "$python" scripts/run_affected_tests.py --changed-paths "$RUNNER_TEMP/changed-paths.json" -- $ARGUMENTS
        fi
    # The tests run rayo and rayoc in debug, where checks that a release build leaves out still run, such as the
    # checks of lowering's Rayo IR. So the release build users run is built and run here too, and its
    # products are saved with the build, so a pull request rebuilds only what it changed.
    - name: Run the proof programs with release rayo
      if: inputs.release-proof-programs == 'true'
      shell: bash
      run: |
        swift build --help | grep -A3 -- '--build-system' || true
        timed() {
          local start=$(date +%s)
          "$@" > "$RUNNER_TEMP/timed.log" 2>&1 || { tail -50 "$RUNNER_TEMP/timed.log"; exit 1; }
          echo "::notice::$((`date +%s` - start))s, $(grep -c -E '\] Swift(Syntax|Parser)' "$RUNNER_TEMP/timed.log") swift-syntax lines: $*"
        }
        # actions/cache packs with --posix, which keeps each file's time to the nanosecond.
        round_trip() {
          tar --posix -cf "$RUNNER_TEMP/build.tar" .build && rm -rf .build && tar -xf "$RUNNER_TEMP/build.tar" \
            && rm "$RUNNER_TEMP/build.tar"
        }
        env | sort | cut -d= -f1 | tr '\n' ' '
        timed swift build -c release
        timed swift build -c release
        timed env GITHUB_RUN_ID=1 GITHUB_SHA=0 GITHUB_REF=refs/heads/other swift build -c release
        round_trip
        timed swift build -c release
        bin=$(swift build -c release --show-bin-path)

        # Each run passes when it prints the output beside the program, writes no error, and exits with 0. A run
        # that fails doesn't stop the rest, so one CI run reports every failure.
        failed=0
        for program in examples/v[0-9]*/*.rayo; do
          expected=${program%.rayo}.out
          for mode in --debug --release; do
            status=0
            "$bin/rayo" run "$mode" "$program" > "$RUNNER_TEMP/output" 2> "$RUNNER_TEMP/errors" || status=$?
            if [ "$status" -eq 0 ] && [ ! -s "$RUNNER_TEMP/errors" ] \
              && diff -u "$expected" "$RUNNER_TEMP/output"; then
              echo "$program, $mode: passed"
            else
              cat "$RUNNER_TEMP/errors"
              echo "::error file=$program::release rayo's $mode run exited with $status, or wrote other than $expected"
              failed=1
            fi
          done
        done
        exit "$failed"
    - name: Save the build
      if: github.event_name == 'push' && steps.build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .build
        key: ${{ steps.build.outputs.cache-primary-key }}
